[workspace]
resolver = "2"
members = [
    "crates/herta_core",
    "crates/herta_db",
    "crates/herta_auth",
    "crates/herta_storage",
    "crates/herta_api",
    "crates/herta_server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/Herta-ai/hertabase"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3.33"
argon2 = "0.5.3"
async-recursion = "1.1.1"
clap = { version = "4.6.5", features = ["derive"] }
email_address = "0.2.9"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs"] }
mime = "0.3.17"
mime-infer = "4.0.1"
object_store = { version = "0.13.2", default-features = false, features = ["fs", "aws", "tls-webpki-roots"] }
rand = "0.8.7"
regex = "1.12.3"
salvo = { version = "0.95.0", features = ["affix-state", "anyhow", "cors", "oapi", "sse"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
surrealdb = { version = "3.2.3", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
surrealdb-core = { version = "3.2.3", default-features = false }
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml = "0.8.23"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = true
